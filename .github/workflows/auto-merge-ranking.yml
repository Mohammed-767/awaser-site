# Auto-approves and merges OSJAM's weekly ranking update, but only when the
# pull request changes public/data.json and nothing else, and the file is valid JSON.
# Any other change still waits for the owner's review.
#
# Safety: pull_request_target runs this file from main, never from the PR,
# and the job never checks out or runs the PR's code. It only reads the file
# list and parses data.json as text.

name: Auto-merge ranking data
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  auto_merge:
    if: github.event.pull_request.user.login == 'OSJAM' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const pull_number = pr.number;

            if (pr.base.ref !== 'main') { core.info('Not targeting main; skipping.'); return; }

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number });
            const names = files.map(f => f.filename);
            const onlyData = files.length === 1 && names[0] === 'public/data.json' && files[0].status === 'modified';
            if (!onlyData) {
              core.info('PR changes more than public/data.json (' + names.join(', ') + '); leaving it for the owner.');
              return;
            }

            const { data: blob } = await github.rest.repos.getContent({
              owner: pr.head.repo.owner.login, repo: pr.head.repo.name,
              path: 'public/data.json', ref: pr.head.sha,
            });
            let d;
            try { d = JSON.parse(Buffer.from(blob.content, 'base64').toString('utf8')); }
            catch (e) { core.setFailed('public/data.json is not valid JSON: ' + e.message); return; }
            const ok = d && typeof d === 'object' && typeof d.updated === 'string'
              && d.members && typeof d.members === 'object' && d.outings && typeof d.outings === 'object';
            if (!ok) { core.setFailed('public/data.json is missing updated, members or outings.'); return; }

            await github.rest.pulls.createReview({ owner, repo, pull_number, event: 'APPROVE',
              body: 'Approved automatically: only public/data.json changed and it is valid.' });
            await github.rest.pulls.merge({ owner, repo, pull_number, merge_method: 'squash', sha: pr.head.sha });

            // A merge made with GITHUB_TOKEN does not fire the push trigger, so start the deploy explicitly.
            await github.rest.actions.createWorkflowDispatch({ owner, repo,
              workflow_id: 'firebase-hosting-merge.yml', ref: 'main' });
            core.info('Merged #' + pull_number + ' and started the deploy.');
