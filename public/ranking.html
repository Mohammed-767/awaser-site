<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#900c07">
<title>ترتيب الانضباط · طلعة أواصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{
  --brand:#900c07; --on-brand:#fff;
  --page:#f6f1f0; --card:#fff; --sunken:#efe6e5; --line:#e4d8d6;
  --text:#1f1514; --muted:#6e5f5d;
  --ok:#23704b; --ok-bg:#dcefe4; --warn:#b98100; --warn-bg:#f8eccb; --bad:#b3261e; --bad-bg:#f7dcd9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#e0574f; --on-brand:#1a0605;
  --page:#141010; --card:#1e1817; --sunken:#2a2221; --line:#3a2f2e;
  --text:#f3eceb; --muted:#b3a5a3;
  --ok:#5cc48e; --ok-bg:#163527; --warn:#f0c34e; --warn-bg:#3a2f10; --bad:#f07a66; --bad-bg:#3d1f1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#e0574f; --on-brand:#1a0605;
  --page:#141010; --card:#1e1817; --sunken:#2a2221; --line:#3a2f2e;
  --text:#f3eceb; --muted:#b3a5a3;
  --ok:#5cc48e; --ok-bg:#163527; --warn:#f0c34e; --warn-bg:#3a2f10; --bad:#f07a66; --bad-bg:#3d1f1a;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:1.7rem;line-height:1.2}
h2{margin:0;font-size:1.1rem}
.eyebrow{color:var(--brand);font-weight:700;font-size:.8rem}
.muted{color:var(--muted);font-size:.875rem}
a.back{color:var(--brand);font-weight:600;text-decoration:none}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
input[type=search]{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;margin-bottom:14px}
ol.board{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:2.2rem 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.pos{text-align:center;font-weight:700;font-size:1.1rem;color:var(--muted)}
.who{display:flex;flex-direction:column;gap:6px;min-width:0}
.name{font-weight:600;overflow-wrap:anywhere}
.bar{height:6px;background:var(--sunken);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.score{font-weight:700;font-size:1.5rem;min-width:3ch;text-align:left;font-variant-numeric:tabular-nums}
.score.low{color:var(--bad)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:600;padding:0 8px;border-radius:999px;background:var(--sunken)}
.chip.good{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
dl.rules{display:grid;grid-template-columns:1fr auto;margin:0}
dl.rules dt,dl.rules dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}
dl.rules dd{font-weight:700;text-align:left}
.minus{color:var(--bad)} .plus{color:var(--ok)}
ol.terms{margin:0;padding-inline-start:1.3em;display:flex;flex-direction:column;gap:8px}
.empty{text-align:center;color:var(--muted);padding:24px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="eyebrow">طلعة أواصر</div><h1>ترتيب الانضباط</h1></div>
    <div><div class="muted" id="cycle"></div><a class="back" href="/">← الرجوع لجدول الطلعات</a></div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="rank" aria-selected="true">الترتيب</button>
    <button class="tab" role="tab" data-tab="rules" aria-selected="false">اللائحة</button>
  </nav>
  <main id="view"><div class="card empty">جاري التحميل…</div></main>
</div>
<script>
// Data comes from data.json next to this page (summed points only, no reasons).
const STREAK=10, CARRY=15;
let D=null, tab='rank', q='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn=n=>n>0?'+'+n:n<0?'−'+Math.abs(n):'0';
const fmtDate=s=>{try{return new Date(s+'T12:00:00').toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'})}catch(e){return s}};
const meta=()=>D.meta||{current:'c1',cycles:[{id:'c1',name:'الدورة 1',start:D.updated,bonus:{}}]};
const cycle=id=>meta().cycles.find(c=>c.id===id)||meta().cycles[0];

function compute(){
  const cid=meta().current, c=cycle(cid);
  const outs=Object.values(D.outings||{}).filter(o=>o.cycle===cid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const ms=Object.entries(D.members||{}).map(([id,m])=>({id,...m}));
  const rows=ms.map(m=>{
    let streak=0,sum=0,last=null; const bonus=(c.bonus&&c.bonus[m.id])||0;
    for(const o of outs){
      const r=o.rec&&o.rec[m.id]; if(!r){streak=0;continue}
      last=r.st; sum+=(r.n||0)+(r.p||0);
      if(r.n<0){streak++;if(streak===3){sum-=STREAK;streak=0}}else streak=0;
    }
    return{...m,bonus,bal:100+bonus+sum,perm:last==='perm'};
  }).sort((a,b)=>b.bal-a.bal||a.name.localeCompare(b.name,'ar'));
  const main=rows.filter(r=>!r.perm), perm=rows.filter(r=>r.perm);
  const rank=L=>L.forEach(r=>{r.above=L.filter(x=>x.bal>r.bal).length;r.below=L.filter(x=>x.bal<r.bal).length;r.rank=r.above+1;r.tie=L.filter(x=>x.bal===r.bal).length>1;r.out=r.bal<=0});
  rank(main);rank(perm);
  return{main,perm,outs,c};
}
function row(r){
  const w=Math.max(0,Math.min(100,r.bal/(100+CARRY)*100)), cls=r.bal<33?'low':r.bal<66?'mid':'';
  const chips=[r.out?'<span class="chip bad">مستبعد</span>':'',r.bonus?`<span class="chip good">رصيد مرحّل +${r.bonus}</span>`:''].join('');
  return`<li class="row"><span class="pos"${r.tie?' title="متعادل"':''}>${r.rank}</span>
    <span class="who"><span class="name">${esc(r.name)}</span><span class="bar"><i class="${cls}" style="width:${w}%"></i></span>${chips?`<span class="chips">${chips}</span>`:''}</span>
    <span class="score ${cls==='low'?'low':''}">${r.bal}</span></li>`;
}
function vRank(){
  const{main,perm,outs,c}=compute(), m=r=>!q||r.name.includes(q.trim());
  if(!main.length&&!perm.length)return'<div class="card empty">ما فيه بيانات للحين.</div>';
  const A=main.filter(m),B=perm.filter(m);
  let h=`<input type="search" id="q" placeholder="دوّر اسمك" aria-label="دوّر اسم عضو" value="${esc(q)}">`;
  h+=`<div class="card"><div class="card-head"><h2>${esc(c.name)}</h2><span class="muted">${outs.length} طلعة مسجّلة</span></div>`;
  h+=A.length?`<ol class="board">${A.map(row).join('')}</ol>`:`<p class="muted">ما فيه اسم يطابق «${esc(q)}».</p>`;
  h+='</div>';
  if(B.length)h+=`<div class="card"><div class="card-head"><h2>أصحاب العذر الدائم</h2><span class="muted">${perm.length} عضو</span></div><p class="muted">ترتيب منفصل، ما يدخلون في منافسة المراكز.</p><ol class="board">${B.map(row).join('')}</ol></div>`;
  return h+`<p class="muted">آخر تحديث: ${fmtDate(D.updated)}.</p>`;
}
function vRules(){
  const R=[['الغياب عن الطلعة دون عذر',-25],['الغياب عن الطلعة بعذر',-15],['غائب بعذر دائم (بدون خصم)',0],['التأخر عن الحضور بعد صلاة المغرب',-5],['التأخر عن الحضور بعد العشاء',-10],['الانقطاع عن الطلعة بعد الحضور',-15],['التأخر في الضيافة',-5],['التقصير في متطلبات البرنامج الإثرائي','يُحدد'],['تقديم برنامج «إضاءة»',5]];
  return`<div class="card"><h2>بنود الخصم والإضافة</h2><dl class="rules">${R.map(([t,p])=>`<dt>${t}</dt><dd class="${typeof p==='number'?(p<0?'minus':p>0?'plus':''):''}">${typeof p==='number'?sgn(p):p}</dd>`).join('')}</dl></div>
  <div class="card"><h2>ضوابط التطبيق</h2><ol class="terms">
  <li>تُحتسب نهاية الطلعة اعتبارًا من وقت تقديم وجبة العشاء.</li>
  <li>تكرار المخالفات ثلاثة أسابيع متتالية (نفس المخالفة أو مختلفة) يضيف خصم 10 نقاط.</li>
  <li>الرصيد الأساسي 100 نقطة، ويُستبعد العضو عند وصول رصيده إلى صفر.</li>
  <li>صاحبا المركزين الأخيرين يُكلّفان بمهام، وصاحبا المركزين الأول والثاني يحصلان على 15 نقطة في الدورة التالية.</li>
  <li>يُحتسب الانقطاع بعد ساعة وعشر دقائق من وقت الخروج.</li>
  </ol><p class="muted">لون الرصيد: أحمر إذا كان أقل من 33، وأصفر إذا كان أقل من 66.</p></div>`;
}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  const hadQ=document.activeElement&&document.activeElement.id==='q';
  $('#view').innerHTML=tab==='rank'?vRank():vRules();
  if(hadQ&&$('#q')){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}
}
document.addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){tab=t.dataset.tab;render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;render()}});
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  D=d; const c=cycle(meta().current); $('#cycle').textContent=c.name+' · بدأت '+fmtDate(c.start); render();
}).catch(()=>{$('#view').innerHTML='<div class="card empty">ما قدرت أحمّل بيانات الترتيب.</div>'});
</script>
</body>
</html>
