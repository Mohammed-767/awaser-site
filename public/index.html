.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;font-size:14px;display:inline-block}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:500}
.btn.p:hover{filter:brightness(1.12)}
.btn:focus-visible,li:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--bd)}
li{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
li .n{width:26px;color:var(--mu);font-size:14px}
li .t{margin-inline-start:auto;font-size:12px;background:var(--ac);color:var(--on);border-radius:20px;padding:1px 10px}
summary{cursor:pointer}
.sub{display:block;font-size:12px;color:var(--mu);line-height:1.3}
.ic{margin-inline-start:auto;border:1px solid var(--bd);border-radius:8px;padding:2px 9px;font-size:12px;color:var(--mu);text-decoration:none}
.t+.ic{margin-inline-start:0}
.subbox{display:none;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:0 0 16px;font-size:14px}.subbox.on{display:block}.subbox b{display:block;margin-bottom:2px}.subbox span{display:block;color:var(--mu);font-size:13px}.subbox .btn{margin-top:10px}
.note{display:none;border:1px solid var(--ac);border-radius:12px;padding:12px;margin:0 0 16px}.note.on{display:block}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}.sheet.on{display:flex}
.box{background:var(--sf);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.box h2{margin:0;font-size:22px}.box p{color:var(--mu);margin:4px 0 14px}.box .row{margin-top:10px}
select,input{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.admin{margin-top:26px;border:1px dashed var(--bd);border-radius:12px;padding:14px;display:none}.admin.on{display:block}
.admin label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.foot{margin-top:22px;text-align:center}
.link{background:none;border:0;color:var(--mu);font-size:13px;cursor:pointer;text-decoration:underline}
/* Views */
.view{display:none}
:root[data-view="home"] #v-home,:root[data-view="hospitality"] #v-hospitality,:root[data-view="discipline"] #v-discipline{display:block}
:root:not([data-view="home"]) .logo img{width:56px;height:56px;border-radius:14px}
:root:not([data-view="home"]) h1{margin-bottom:10px}
.back{gap:6px;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;font-weight:700;text-decoration:none;font-size:15px;padding:0 16px;margin-bottom:14px}
.back:hover{border-color:var(--ac)}
.back b{font-size:18px;line-height:1}
.logo a{display:inline-block;border-radius:22px}
main{position:relative}
.night{position:absolute;top:14px;left:16px;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;cursor:pointer;padding:0}
.night:hover{border-color:var(--ac)}.night:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.night svg{width:20px;height:20px}.night .sun{display:none}
:root[data-dark="1"] .night .sun{display:block}:root[data-dark="1"] .night .moon{display:none}
.back:focus-visible,.logo a:focus-visible,.pick:focus-visible,.tab:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Welcome */
.hello{text-align:center;margin:0 0 22px}
.hello b{display:block;font-size:clamp(28px,8vw,38px);font-weight:800;line-height:1.2;color:var(--act)}
.v-title,.d-head h2{margin:0;font-size:26px;line-height:1.2}
.v-title{margin-bottom:6px}
/* Touch targets: at least 44px tall */
.back,.link,.tab{min-height:44px}
.back{display:inline-flex;align-items:center}
.ic{position:relative}.ic::after{content:"";position:absolute;inset:-10px -2px}
.pos small{display:block;font-size:10px;font-weight:400;line-height:1}
.hello span{color:var(--mu);font-size:15px}
.pick{display:block;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;color:inherit;text-decoration:none}
.picks{display:grid;grid-auto-rows:1fr;gap:12px}
.pick:hover{border-color:var(--ac)}
.pick b{display:block;font-size:20px;font-weight:700;line-height:1.3}
.pick span{display:block;color:var(--mu);font-size:14px;margin-top:2px}
#w-next{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#w-next span{margin:0;min-width:0}
#w-next span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#w-next span:last-child{white-space:nowrap;flex-shrink:0}
/* Discipline */
.d-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--mu);font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:14px}
.tab{border:0;background:transparent;color:var(--mu);font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab[aria-selected="true"]{background:var(--ac);color:var(--on)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0;font-size:17px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
#d-q{border-radius:999px;background:var(--sf);padding:8px 16px;margin-bottom:14px}
#d-q:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
ol.board{list-style:none;margin:0;padding:0}
ol.board li{display:grid;grid-template-columns:2.2rem 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--bd);cursor:default}
ol.board li:last-child{border-bottom:0}
.pos{text-align:center;font-weight:700;font-size:18px;color:var(--mu)}
.d-who{display:flex;flex-direction:column;gap:6px;min-width:0}
.d-name{font-weight:600;overflow-wrap:anywhere}
.bar{height:6px;background:var(--sunken);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar i.mid{background:var(--warn)}.bar i.low{background:var(--bad)}
.score{font-weight:700;font-size:24px;min-width:3ch;text-align:left;font-variant-numeric:tabular-nums}
.score.low{color:var(--bad)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:0 8px;border-radius:999px;background:var(--sunken)}
.chip.good{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
dl.rules{display:grid;grid-template-columns:1fr auto;margin:0}
dl.rules dt,dl.rules dd{margin:0;padding:8px 0;border-bottom:1px solid var(--bd)}
dl.rules dd{font-weight:700;direction:ltr;text-align:left;padding-left:0;padding-right:12px}
.minus{color:var(--bad)}.plus{color:var(--ok)}
ol.terms{margin:8px 0 0;padding-inline-start:1.3em}
ol.terms li{display:list-item;padding:0 0 8px;border:0;cursor:default}
.empty{text-align:center;color:var(--mu);padding:24px}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
#dsc .foot{margin-top:22px}
#dsc .tab{padding:6px 10px;font-size:15px}
#dsc select,#dsc input[type=date],#dsc input[type=number]{width:auto}
#dsc textarea{width:100%;min-height:7em;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font:inherit;color:inherit;resize:vertical}
.d-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.d-row:first-child{margin-top:0}
.d-spread{justify-content:space-between}
.d-grow{flex:1;min-width:0}
#dsc .d-row #d-q{margin-bottom:0}
#dsc > #d-view > .d-row{margin-bottom:14px}
.btn.d-sm{padding:6px 12px;font-size:13px}
.btn.d-danger{color:var(--bad);border-color:var(--bad)}
.btn.d-ghost{border-style:dashed;background:transparent;color:var(--mu)}
.d-linkish{border:0;background:none;padding:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.d-banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:14px;margin:0 0 12px}
.d-tie{color:var(--warn);font-size:14px;margin:0 0 6px}
ol.board li.d-open{display:block;padding:0}
.d-toggle{display:grid;grid-template-columns:2.2rem 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 2px;border:0;background:none;color:inherit;font:inherit;text-align:inherit;cursor:pointer;border-radius:8px}
.d-toggle:hover{background:var(--sunken)}
.d-toggle:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.d-detail{margin-inline-start:calc(2.2rem + 14px);padding-bottom:10px;font-size:14px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.d-detail b{color:var(--tx)}
.d-ln{display:flex;justify-content:space-between;gap:8px}
.d-adhan{background:var(--sunken);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
.d-adhan b{font-size:18px}
.d-adhan select{padding:2px 8px;font-size:13px}
.d-inline{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mu)}
.d-roll{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px dashed var(--bd)}
.d-roll:last-child{border-bottom:0}
.d-roll-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-total{font-weight:700;font-variant-numeric:tabular-nums}
.d-seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--sunken);border-radius:999px;align-self:flex-start}
.d-seg button{border:0;background:transparent;color:var(--mu);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.d-seg button[aria-pressed="true"]{background:var(--sf);color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--tx)}
.d-seg button[aria-pressed="true"].neg{color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.d-toggle-chip{border:1px solid var(--bd);background:transparent;color:var(--mu);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.d-toggle-chip[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.d-toggle-chip.positive[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.d-seg button:focus-visible,.d-toggle-chip:focus-visible,.d-linkish:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.d-enrich{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mu)}
.d-enrich input{width:4.5em!important;text-align:center;padding:4px 8px}
.d-list{display:flex;flex-direction:column}
.d-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.d-item:last-child{border-bottom:0}
.d-saved{font-size:12px;color:var(--ok);font-weight:600}
.d-lbl{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.d-note-line{font-weight:600;margin:6px 0 0}
.d-success{border-color:var(--ok)}.d-success h3{color:var(--ok)}
.d-choice{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:10px 0;display:flex;flex-direction:column;gap:8px}
.d-choice legend{font-weight:700;padding:0 4px}
.d-check{display:flex;align-items:center;gap:8px;font-size:14px}
.d-check input{width:auto}
.d-savebar{position:fixed;inset:auto 0 0 0;z-index:4;background:var(--sf);border-top:1px solid var(--bd);box-shadow:0 -2px 10px rgb(0 0 0/.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.d-savebar-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.d-savebar .d-row{margin-top:0}
body.d-bar-on main{padding-bottom:110px}
:root:not([data-view="discipline"]) .d-savebar{display:none}
.d-toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:14px;z-index:6;max-width:calc(100% - 32px)}
body.d-bar-on .d-toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.d-toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;text-decoration:underline;margin-inline-start:12px;cursor:pointer}
.d-pdf{position:fixed;left:-10000px;top:0;width:720px;padding:32px;background:var(--bg);color:var(--tx);font-family:var(--font)}
.d-pdf h2{margin:0 0 4px}
</style>
</head>

function def(){var d=new Date();d.setDate(d.getDate()+((1-d.getDay()+7)%7||7));
 return{title:"طلعة أواصر",date:d.toISOString().slice(0,10),time:"19:30",members:["عضو ١","عضو ٢","عضو ٣","عضو ٤"],hd:2,gd:1}}

function norm(){var B=RAW||def();S=JSON.parse(JSON.stringify(B));
 var p=S.date.split("-"),b=new Date(+p[0],+p[1]-1,+p[2]),t=new Date();t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
 var diff=Math.round((t-b)/864e5);
 if(diff>0&&S.members.length){var k=Math.ceil(diff/7);
  for(var j=0;j<k%S.members.length;j++)S.members.push(S.members.shift());

function dateOf(i){var d=new Date(S.date+"T"+S.time);d.setDate(d.getDate()+7*i);return d}
function fmt(d){return d.toLocaleDateString("ar-u-ca-gregory",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function fmtT(){var p=S.time.split(":"),d=new Date();d.setHours(+p[0],+p[1]);return d.toLocaleTimeString("ar",{hour:"numeric",minute:"2-digit"})}
function dl(x){var L="ar-u-ca-gregory-nu-latn";return x.toLocaleDateString(L,{weekday:"long"})+"، "+x.getDate()+" "+x.toLocaleDateString(L,{month:"long"})+"، "+x.getFullYear()}
function pad(n){return String(n).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function calLink(i){i=i||0;var p=S.date.split("-"),t=S.time.split(":"),u=Date.UTC(+p[0],+p[1]-1,+p[2]+7*i,+t[0],+t[1])-3*36e5,e=u+3*36e5;
 var f=x=>new Date(x).toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
 return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(NAME+" - "+S.members[i])+"&dates="+f(u)+"%2F"+f(e)+"&details="+encodeURIComponent("الدور على "+S.members[i]+"\n"+location.href.split("#")[0])+"&ctz=Asia%2FRiyadh"}
function icsEsc(t){return String(t).replace(/[\\,;]/g,"\\$&")}
function icsText(i){var p=S.date.split("-"),t=S.time.split(":"),u=Date.UTC(+p[0],+p[1]-1,+p[2]+7*i,+t[0],+t[1])-3*36e5,e=u+3*36e5;
 var z=x=>new Date(x).toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
 var c=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//awaser//AR","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:awaser-"+S.date+"-"+i+"@awaser","DTSTAMP:"+z(Date.now()),"DTSTART:"+z(u),"DTEND:"+z(e),"SUMMARY:"+icsEsc(NAME+" - "+S.members[i]),"DESCRIPTION:"+icsEsc("الدور على "+S.members[i]),"STATUS:CONFIRMED","SEQUENCE:0","TRANSP:OPAQUE","END:VEVENT","END:VCALENDAR"].join("\r\n")+"\r\n";
 return c}
function dlIcs(i){var c=icsText(i),b=new Blob([c],{type:"text/calendar;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download="طلعة أواصر.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function calSheet(i){
 $("box").innerHTML='<h2>أضف للتقويم</h2><p>جرّب الخيارات بالترتيب حتى يعمل أحدها:</p><div class="row" style="margin-top:0;flex-direction:column">'
  +'<a class="btn p" href="'+calLink(i)+'">١) تقويم Google</a>'
  +'<a class="btn" id="c-a" href="data:text/calendar;charset=utf-8,'+encodeURIComponent(icsText(i))+'">٢) فتح مباشرة في تقويم الجهاز</a>'
  +'<button class="btn" id="c-d">٣) تحميل الملف ثم فتحه</button></div><p style="margin-top:14px;font-size:13px">إن لم يعمل أي خيار فغالبًا مانع الإعلانات يحجبه، فعطّله لهذا الموقع ثم أعد المحاولة.</p><div class="row"><button class="btn" id="cl">إغلاق</button></div>';
 $("sheet").className="sheet on";$("cl").onclick=close_;
 $("c-d").onclick=function(){dlIcs(i)}}
function saveIcs(i){var ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 if(ios)calSheet(i);else dlIcs(i)}
document.addEventListener("click",e=>{var a=e.target.closest("[data-ics]");if(a){e.preventDefault();saveIcs(+a.dataset.ics)}});
function render(){
 $("ttl").textContent=NAME;document.title="طلعة أواصر";
 if(!RAW){$("who").textContent="جارٍ التحميل…";$("when").textContent="";$("list").innerHTML="";return}
 $("who").textContent=S.members[0]||"لا يوجد أعضاء";
 $("w-next").innerHTML=S.members[0]?"<span>الدور الجاي: "+esc(S.members[0])+"</span><span>"+dateOf(0).toLocaleDateString("ar-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long"})+"</span>":"جدول الضيافة والطلعة الجاية";
 $("when").textContent=fmt(dateOf(0))+"، "+fmtT();
 $("cal").href="#";$("cal").dataset.ics=0;
 var h="";S.members.forEach((m,i)=>{h+='<li tabindex="0" data-i="'+i+'"><span class="n">'+(i+1).toLocaleString("ar")+'</span><span><span>'+esc(m)+'</span><small class="sub">'+dl(dateOf(i))+'</small></span>'+(i==0?'<span class="t">الدور الجاي</span>':"")+'<a class="ic" data-ics="'+i+'" href="#">أضف للتقويم</a></li>'});
 $("list").innerHTML=h;
 $("admin").className="admin"+(admin?" on":"");
 $("mode").textContent=admin?"إغلاق وضع المنشئ":"وضع المنشئ";
 $("a-d").value=S.date;$("a-h").value=S.time;$("a-hd").value=S.hd;$("a-gd").value=S.gd;note();subRender();
}
function isStandalone(){return(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}
function isIOS(){return/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
async function subscribe(){
 var reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
 var tok=await getToken(getMessaging(app),{vapidKey:VAPID,serviceWorkerRegistration:reg});
 if(tok)await setDoc(doc(db,"subs",tok),{token:tok});
 return!!tok}
var subDone=false;
async function subRender(){
 var b=$("subbox"),h="";
 function put(x){b.innerHTML=x;b.className="subbox"+(x?" on":"")}
 if(admin||VAPID.indexOf("PASTE")===0){put("");return}
 if(isIOS()&&!isStandalone()){
  put("<b>تنبيه يوم الطلعة</b><span>لتصلك التنبيهات على الآيفون: اضغط زر المشاركة في سفاري ثم «إضافة إلى الشاشة الرئيسية»، وافتح الموقع من الأيقونة الجديدة وفعّل التنبيه.</span>");return}
 var sup=false;try{sup=typeof Notification!=="undefined"&&await isSupported()}catch(e){}
 if(!sup){put("");return}
 if(Notification.permission==="granted"){
  put("<span>تنبيه يوم الطلعة مفعّل على هذا الجهاز.</span>");
  if(!subDone){subDone=true;subscribe().catch(function(){subDone=false})}
  return}
 if(Notification.permission==="denied"){put("<span>التنبيهات محظورة لهذا الموقع. فعّلها من إعدادات المتصفح أو الجهاز.</span>");return}
 put('<b>تنبيه يوم الطلعة</b><span>يصلك تنبيه صباح يوم الطلعة باسم صاحب الدور.</span><button class="btn p" id="s-on">فعّل التنبيه</button>');
 $("s-on").onclick=async function(){
  try{var perm=await Notification.requestPermission();
   if(perm==="granted"){await subscribe();subDone=true}
   subRender()}catch(e){put("<span>تعذر التفعيل ("+(e&&e.code?e.code:"unknown")+")</span>")}}}
function waText(i,host){return host?"السلام عليكم ورحمة الله وبركاته\n\nاسعد الله مسائك "+S.members[i]+"،\nتذكير: الدور عليك في طلعة أواصر\nيوم "+dl(dateOf(i))+"\n\n\nنرحب في الإبداع والتجديد بالضيافة ."
 :"السلام عليكم،\nتذكير: الدور في "+NAME+" على "+S.members[i]+"\nيوم "+dl(dateOf(i))}
function wa(i,host){if(!S.members[i])return;showMsg(waText(i,host),host?(P[S.members[i]]||""):"")}
function showMsg(msg,p){
 $("box").innerHTML='<h2>الرسالة جاهزة</h2><p>اضغط «فتح واتساب»، وإن لم يفتح فانسخ الرسالة وألصقها في المحادثة.</p><div id="mt" style="background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;white-space:pre-wrap;-webkit-user-select:all;user-select:all">'+esc(msg)+'</div><div class="row"><a class="btn p" target="_blank" rel="noopener" href="https://wa.me/'+p+'?text='+encodeURIComponent(msg)+'">فتح واتساب</a><button class="btn" id="cp">انسخ الرسالة</button><button class="btn" id="cl">إغلاق</button></div>';
 $("sheet").className="sheet on";$("cl").onclick=close_;
 $("cp").onclick=function(){var b=this;
  function sel(){var r=document.createRange();r.selectNodeContents($("mt"));var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="حدّد الرسالة وانسخها"}
  if(navigator.clipboard){navigator.clipboard.writeText(msg).then(()=>{b.textContent="تم النسخ"},sel)}else sel()}}
function close_(){$("sheet").className="sheet"}
function note(){var n=$("note"),t=new Date();t.setHours(0,0,0,0);var d=dateOf(0);d.setHours(0,0,0,0);var k=Math.round((d-t)/864e5),h="";
 if(admin&&S.members.length){
  if(k==S.hd)h+='<div>اليوم موعد تذكير '+esc(S.members[0])+'. <button class="btn p" id="n-h">أرسل التذكير</button></div>';
  if(k==S.gd)h+='<div style="margin-top:8px">اليوم موعد تذكير الجميع. <button class="btn p" id="n-g">أرسل التذكير</button></div>'}
 n.innerHTML=h;n.className="note"+(h?" on":"");
 if($("n-h"))$("n-h").onclick=()=>wa(0,true);
 if($("n-g"))$("n-g").onclick=()=>wa(0,false)}
function open_(i){
 var m=S.members[i],opts="";
 S.members.forEach((x,j)=>{if(j!=i)opts+='<option value="'+j+'">'+esc(x)+"</option>"});
 var h="<h2>"+esc(m)+"</h2><p>دوره المتوقع: "+fmt(dateOf(i))+"</p>";
 if(S.members.length>1){
  h+='<select id="sw" aria-label="التبديل مع">'+opts+"</select>";
  h+=admin?'<div class="row"><button class="btn p" id="do">بدّل الدورين</button><button class="btn" id="rm">احذف الاسم</button></div>'
          :'<div class="row"><button class="btn p" id="do">اطلب تبديل</button></div>'}
 if(admin)h+='<label style="display:block;font-size:13px;color:var(--mu);margin:12px 0 4px" for="nm">تغيير الاسم</label><div class="row" style="margin-top:0"><input id="nm" value="'+esc(m)+'"><button class="btn p" id="rnm" style="width:90px">حفظ</button></div>';
 if(admin)h+='<input id="ph" type="tel" inputmode="tel" placeholder="رقم الواتساب مع المفتاح، مثال: 9665xxxxxxxx" value="'+esc(P[m]||"")+'" style="margin-top:10px"><div class="row"><button class="btn" id="rn">ذكّره الآن</button></div>';
 h+='<div class="row"><a class="btn" data-ics="'+i+'" href="#">أضف لتقويم الجهاز</a><a class="btn" target="_blank" rel="noopener" href="'+calLink(i)+'">تقويم Google</a><button class="btn" id="cl">إغلاق</button></div>';
 $("box").innerHTML=h;$("sheet").className="sheet on";
 $("cl").onclick=close_;
 if($("rnm"))$("rnm").onclick=async function(){var v=$("nm").value.trim();if(!v||v===m){return}
  if(S.members.indexOf(v)>-1){alert("هذا الاسم موجود مسبقًا");return}
  S.members[i]=v;
  if(P[m]){P[v]=P[m];delete P[m];await savePh()}
  await save();close_()};
 if($("ph"))$("ph").onchange=function(){P[m]=this.value.replace(/\D/g,"");savePh()};
 if($("rn"))$("rn").onclick=async function(){if($("ph")){P[m]=$("ph").value.replace(/\D/g,"");await savePh()}wa(i,true)};
 if($("do"))$("do").onclick=function(){var j=+$("sw").value;
  if(admin){var t=S.members[i];S.members[i]=S.members[j];S.members[j]=t;save();close_()}
  else{showMsg("السلام عليكم، أرغب بتبديل دوري ("+m+"، "+fmt(dateOf(i))+") مع "+S.members[j]+" ("+fmt(dateOf(j))+")","")}};
 if($("rm"))$("rm").onclick=function(){S.members.splice(i,1);save();close_()};
}
function login(){
 $("box").innerHTML='<h2>دخول المنشئ</h2><p>أدخل بريدك وكلمة المرور.</p><input id="em" type="email" autocomplete="username" placeholder="البريد"><input id="pw" type="password" autocomplete="current-password" placeholder="كلمة المرور" style="margin-top:10px"><p id="er" style="color:#d33;margin:8px 0 0"></p><div class="row"><button class="btn p" id="go">دخول</button><button class="btn" id="cl">إغلاق</button></div>';
 $("sheet").className="sheet on";$("cl").onclick=close_;
 $("go").onclick=function(){signInWithEmailAndPassword(au,$("em").value.trim(),$("pw").value).then(()=>{admin=true;close_();render()}).catch(e=>{$("er").textContent="تعذر الدخول ("+(e&&e.code?e.code:"unknown")+")"})}}

$("sheet").onclick=e=>{if(e.target===$("sheet"))close_()};
$("list").onclick=e=>{if(e.target.closest(".ic"))return;var l=e.target.closest("li");if(l)open_(+l.dataset.i)};
$("list").onkeydown=e=>{if(e.key==="Enter"){var l=e.target.closest("li");if(l)open_(+l.dataset.i)}};
$("mode").onclick=()=>{if(!user){login();return}admin=!admin;render()};
$("a-out").onclick=()=>{signOut(au)};
function ghGet(k){try{return localStorage.getItem(k)||""}catch(e){return""}}
$("gh-r").value=ghGet("gh_repo");
$("gh-s").onclick=function(){var r=$("gh-r").value.trim(),t=$("gh-t").value.trim();
 try{if(r)localStorage.setItem("gh_repo",r);if(t)localStorage.setItem("gh_tok",t)}catch(e){}
 $("gh-t").value="";$("test-st").textContent="تم الحفظ على هذا الجهاز."};
$("gh-c").onclick=function(){try{localStorage.removeItem("gh_tok");localStorage.removeItem("gh_repo")}catch(e){}
 $("gh-r").value="";$("gh-t").value="";$("test-st").textContent="تم مسح الإعداد من هذا الجهاز."};
async function runTest(mode){var st=$("test-st"),r=ghGet("gh_repo"),t=ghGet("gh_tok");
 if(!r||!t){st.textContent="أضف المستودع والمفتاح أولًا من «إعداد الربط مع GitHub».";return}
 st.textContent="جارٍ الطلب…";
 try{var res=await fetch("https://api.github.com/repos/"+r+"/actions/workflows/reminders.yml/dispatches",{method:"POST",
   headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+t,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},
   body:JSON.stringify({ref:"main",inputs:{mode:mode}})});
  if(res.status===204){st.textContent="تم الطلب. يصلك التنبيه خلال دقيقة تقريبًا.";return}
  var m={401:"المفتاح غير صالح أو منتهٍ.",403:"المفتاح لا يملك صلاحية Actions (Read and write).",404:"المستودع غير صحيح أو المفتاح لا يصل إليه.",422:"ملف الجدولة لا يدعم هذا الوضع. حدّث reminders.yml في GitHub."};
  st.textContent=m[res.status]||("تعذر الطلب ("+res.status+")")}
 catch(e){st.textContent="تعذر الاتصال بـ GitHub."}}
$("a-t1").onclick=function(){runTest("test")};
$("a-t2").onclick=function(){runTest("test-members")};
$("a-push").onclick=async function(){var st=$("push-st");
 try{
  if(!(await isSupported())){st.textContent="هذا المتصفح لا يدعم التنبيهات. على الآيفون أضف الموقع إلى الشاشة الرئيسية ثم افتحه منها.";return}
  if(VAPID.indexOf("PASTE")===0){st.textContent="مفتاح VAPID غير مضاف في الملف.";return}
  var perm=await Notification.requestPermission();
  if(perm!=="granted"){st.textContent="لم يتم السماح بالتنبيهات من إعدادات المتصفح.";return}
  var reg=await navigator.serviceWorker.register("firebase-messaging-sw.js");
  var tok=await getToken(getMessaging(app),{vapidKey:VAPID,serviceWorkerRegistration:reg});
  if(!tok){st.textContent="تعذر الحصول على رمز التنبيه.";return}
  await setDoc(doc(db,"private","push"),{tokens:arrayUnion(tok)},{merge:true});
  st.textContent="تم تفعيل التنبيهات على هذا الجهاز."
 }catch(e){st.textContent="تعذر التفعيل ("+(e&&e.code?e.code:"unknown")+")"}};
$("a-d").onchange=function(){if(this.value){S.date=this.value;save()}};
$("a-h").onchange=function(){if(this.value){S.time=this.value;save()}};
$("a-add").onclick=function(){var v=$("a-n").value.trim();if(v){S.members.push(v);$("a-n").value="";save()}};
$("a-hd").onchange=function(){S.hd=Math.max(0,+this.value||0);save()};
$("a-gd").onchange=function(){S.gd=Math.max(0,+this.value||0);save()};
$("a-rh").onclick=()=>wa(0,true);
$("a-rg").onclick=()=>wa(0,false);
$("a-next").onclick=function(){if(S.members.length){S.members.push(S.members.shift());var d=dateOf(1);S.date=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());save()}};
$("share").onclick=function(){var u=location.href;
 if(navigator.share){navigator.share({title:"طلعة أواصر",url:u}).catch(()=>{})}
 else if(navigator.clipboard){navigator.clipboard.writeText(u).then(()=>{$("share").textContent="تم نسخ الرابط"})}};
/* Views */
const ROOT=document.documentElement;
function setView(){var h=location.hash.slice(1),v=(h==="hospitality"||h==="discipline")?h:"home";ROOT.dataset.view=v;if(v==="discipline")dLoad();window.scrollTo(0,0)}
window.addEventListener("hashchange",setView);

/* Discipline section: loaded the first time the visitor opens it */
let dscP=null;
function dLoad(){if(dscP)return;dscP=import("./discipline.js").then(m=>m.mount($("dsc"))).catch(e=>{console.error(e);dscP=null;$("dsc").innerHTML='<div class="card empty">ما قدرت أحمّل قسم الانضباط. حدّث الصفحة.</div>'})}
/* Night mode: follows the device until the visitor chooses, then remembers the choice */
const sysDark=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function isDark(){var m=ROOT.dataset.mode;return m?m==="dark":!!(sysDark&&sysDark.matches)}
function syncNight(){var d=isDark(),b=$("night");ROOT.dataset.dark=d?"1":"0";b.setAttribute("aria-pressed",d);var l=d?"الوضع النهاري":"الوضع الليلي";b.setAttribute("aria-label",l);b.title=l}
$("night").onclick=function(){var m=isDark()?"light":"dark";ROOT.dataset.mode=m;try{localStorage.setItem("awaser_mode",m)}catch(e){}syncNight()};
if(sysDark&&sysDark.addEventListener)sysDark.addEventListener("change",syncNight);
syncNight();
setView();
render();
</script>
</body>
</html>
